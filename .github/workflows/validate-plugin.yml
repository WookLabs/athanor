name: Validate plugin manifest
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: JSON syntax check
        shell: bash
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool hooks/hooks.json > /dev/null
      - name: Claude plugin validate (Linux only)
        # Skip on Windows: claude CLI install path / shim differs and the
        # JSON schema check above is OS-independent.
        if: runner.os == 'Linux'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate .claude-plugin/marketplace.json
      # Duplicate-hooks check is covered here via
      # scripts/gates/manifest_checks.py::duplicate_hooks_path_check
      # (invoked by scripts/check_release_ready.py check_c).
      - name: Release gate (CI mode — CHANGELOG + manifest checks)
        # Runs only (b) CHANGELOG-entry + (c) no-duplicate-hooks.
        # (a) evidence-ready and (d) contract-ledger need .athanor/ session
        # artifacts which are gitignored and absent in CI fresh checkouts.
        shell: bash
        run: python scripts/check_release_ready.py --ci
      - name: Hook payload replay gate
        shell: bash
        run: python scripts/gates/replay_hook_fixtures.py --fixture-root tests/fixtures/hooks --json
      - name: Hook performance budget gate
        shell: bash
        run: python scripts/gates/check_hook_performance_budget.py --json
      - name: Workflow scenario eval gate
        shell: bash
        run: python scripts/evals/run_workflow_scenarios.py --scenario-root tests/fixtures/workflow_evals --json
      - name: Durable loop fixture gate
        shell: bash
        run: python scripts/loops/run_goal_loop_fixtures.py --fixture-root tests/fixtures/durable_loops --json
      - name: Cross-runtime conformance gate
        shell: bash
        run: python scripts/gates/runtime_conformance.py --json
      - name: Hook installer regression gate
        shell: bash
        run: python -m pytest tests/test_regression_hook_install_dry_run.py tests/test_regression_hook_installer_trust.py tests/test_regression_hook_installer_apply.py tests/test_regression_hook_installer_remove.py -q
      - name: Regression fixtures (pytest)
        shell: bash
        run: |
          pip install pytest jsonschema pyyaml
          pytest tests/ -v
